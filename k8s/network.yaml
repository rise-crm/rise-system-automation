apiVersion: v1
kind: Service
metadata:
  name: whatsapp-backend-service
  namespace: whatsapp-system
spec:
  selector:
    app: whatsapp-backend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8081
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: whatsapp-backend-ingress
  namespace: whatsapp-system
  annotations:
    kubernetes.io/ingress.class: "traefik"
    cert-manager.io/cluster-issuer: letsencrypt-prod
    acme.cert-manager.io/http01-edit-in-place: "true"
spec:
  tls:
    - hosts:
        - api.dariodussin.com.br
      secretName: api-tls
  rules:
    - host: api.dariodussin.com.br
      http:
        paths:
          - path: /webhook
            pathType: Prefix
            backend:
              service:
                name: whatsapp-backend-service
                port:
                  number: 80
          - path: /admin
            pathType: Prefix
            backend:
              service:
                name: whatsapp-backend-service
                port:
                  number: 80