name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Build the Docker Image using Buildx (supports multiple architectures)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ezdussin/whatsapp-automation-backend:latest
          # This ensures it works on your Contabo VPS (AMD64)
          platforms: linux/amd64

      # 2. Set up Kubectl and Context
      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Prepare Kubeconfig
        run: |
          cat <<EOF > k3s_config.yaml
          ${{ secrets.KUBE_CONFIG }}
          EOF
          chmod 600 k3s_config.yaml

      # 3. Deploy to k3s using the server and CA from KUBE_CONFIG
      - name: Deploy to k3s
        run: |
          set -euo pipefail
          KC="kubectl --kubeconfig=k3s_config.yaml -n whatsapp-system"

          if ! $KC get secret backend-secrets -o jsonpath='{.data.REDIS_PASSWORD}' | grep -q .; then
            echo "backend-secrets has no REDIS_PASSWORD. Adding one for Redis and the backend."
            PASS="$(openssl rand -hex 32)"
            $KC patch secret backend-secrets --type merge -p "{\"stringData\":{\"REDIS_PASSWORD\":\"${PASS}\"}}"
            unset PASS
          fi

          $KC apply -f k8s/redis.yaml
          if ! $KC rollout status deployment/redis --timeout=240s; then
            echo "Redis did not become ready."
            $KC get pods -l app=redis -o wide || true
            $KC describe pods -l app=redis || true
            $KC logs -l app=redis --all-containers --tail=200 --prefix || true
            $KC get events --sort-by=.lastTimestamp | tail -n 40 || true
            exit 1
          fi

          $KC apply -f k8s/deployment.yaml
          $KC apply -f k8s/network.yaml
          $KC rollout restart deployment/whatsapp-automation-backend