name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Run tests
        run: |
          chmod +x gradlew
          ./gradlew test --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ezdussin/whatsapp-automation-backend:${{ github.sha }}
            ezdussin/whatsapp-automation-backend:latest
          platforms: linux/amd64

      - name: Set up Kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Prepare Kubeconfig
        run: |
          cat <<EOF > k3s_config.yaml
          ${{ secrets.KUBE_CONFIG }}
          EOF
          chmod 600 k3s_config.yaml

      - name: Deploy to k3s
        env:
          EDGE_FUNCTIONS_URL: ${{ secrets.EDGE_FUNCTIONS_URL }}
          EDGE_FUNCTIONS_KEY: ${{ secrets.EDGE_FUNCTIONS_KEY }}
          EVOLUTION_URL: ${{ secrets.EVOLUTION_URL }}
          EVOLUTION_KEY: ${{ secrets.EVOLUTION_KEY }}
          ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          set -euo pipefail
          KC="kubectl --kubeconfig=k3s_config.yaml -n whatsapp-system"
          IMAGE="ezdussin/whatsapp-automation-backend:${IMAGE_TAG}"

          $KC create secret generic backend-secrets \
            --from-literal=EDGE_FUNCTIONS_URL="${EDGE_FUNCTIONS_URL}" \
            --from-literal=EDGE_FUNCTIONS_KEY="${EDGE_FUNCTIONS_KEY}" \
            --from-literal=EVOLUTION_URL="${EVOLUTION_URL}" \
            --from-literal=EVOLUTION_KEY="${EVOLUTION_KEY}" \
            --from-literal=ADMIN_TOKEN="${ADMIN_TOKEN}" \
            --dry-run=client -o yaml | $KC apply -f -

          if ! $KC get secret backend-secrets -o jsonpath='{.data.REDIS_PASSWORD}' | grep -q .; then
            echo "backend-secrets has no REDIS_PASSWORD. Adding one for Redis and the backend."
            PASS="$(openssl rand -hex 32)"
            $KC patch secret backend-secrets --type merge -p "{\"stringData\":{\"REDIS_PASSWORD\":\"${PASS}\"}}"
            unset PASS
          fi

          $KC apply -f k8s/redis.yaml
          if ! $KC rollout status deployment/redis --timeout=240s; then
            echo "Redis did not become ready."
            $KC get pods -l app=redis -o wide || true
            $KC describe pods -l app=redis || true
            $KC logs -l app=redis --all-containers --tail=200 --prefix || true
            $KC get events --sort-by=.lastTimestamp | tail -n 40 || true
            exit 1
          fi

          sed "s|ezdussin/whatsapp-automation-backend:latest|${IMAGE}|g" k8s/deployment.yaml | $KC apply -f -
          $KC apply -f k8s/network.yaml

          if ! $KC rollout status deployment/whatsapp-automation-backend --timeout=300s; then
            echo "Backend did not become ready."
            $KC get pods -l app=whatsapp-backend -o wide || true
            $KC describe pods -l app=whatsapp-backend || true
            $KC logs -l app=whatsapp-backend --all-containers --tail=200 --prefix || true
            $KC get events --sort-by=.lastTimestamp | tail -n 40 || true
            exit 1
          fi
