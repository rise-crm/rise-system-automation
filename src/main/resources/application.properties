spring.application.name=whatsapp-automation-backend
server.port=${SERVER_PORT:8081}

edge-functions.url=${EDGE_FUNCTIONS_URL:https://xcufkvbnqshrpkdlohka.supabase.co/functions/v1}
edge-functions.key=${EDGE_FUNCTIONS_KEY}

evolution.url=${EVOLUTION_URL}
evolution.key=${EVOLUTION_KEY}
base.url=${BASE_URL:https://api.dariodussin.com.br}
admin.token=${ADMIN_TOKEN}
webhook.rate-limit.permits-per-second=${WEBHOOK_RATE_LIMIT_PERMITS_PER_SECOND:10}
webhook.rate-limit.burst=${WEBHOOK_RATE_LIMIT_BURST:100}
webhook.token-ttl=${WEBHOOK_TOKEN_TTL:600}
webhook.token-lookup.permits-per-second=${WEBHOOK_TOKEN_LOOKUP_PERMITS_PER_SECOND:1}
webhook.token-lookup.burst=${WEBHOOK_TOKEN_LOOKUP_BURST:10}

http.connect-timeout-ms=${HTTP_CONNECT_TIMEOUT_MS:5000}
evolution.response-timeout-ms=${EVOLUTION_RESPONSE_TIMEOUT_MS:30000}
edge-functions.response-timeout-ms=${EDGE_FUNCTIONS_RESPONSE_TIMEOUT_MS:15000}

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.repositories.enabled=false